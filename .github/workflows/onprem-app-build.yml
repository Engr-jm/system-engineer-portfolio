name: Build On-Prem App

on:
  push:
    branches: [main]
    paths:
      - 'onprem-infrastructure/app/**'
      - '.github/workflows/onprem-app-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: python3 -m py_compile onprem-infrastructure/app/app.py

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./onprem-infrastructure/app
          push: true
          tags: |
            ghcr.io/engr-jm/onprem-app:latest
            ghcr.io/engr-jm/onprem-app:${{ github.sha }}


  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-ci

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.APP01_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.APP01_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy application to APP01
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            deploy@100.122.234.58 \
            "sudo -n /usr/local/libexec/onprem/deploy-app.sh ${{ github.sha }}"

